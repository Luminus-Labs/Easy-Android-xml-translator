<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android Strings Translator</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

<div class="theme-toggle">
  <button class="theme-toggle-btn"></button>
</div>

<div class="container">
  <div class="navbar">
    <h1><i class="fa-solid fa-language" aria-hidden="true"></i> Android Strings Translator</h1>
    <div class="navbar-spacer"></div>
    <a href="translator.html" class="active">Translator</a>
    <a href="index.html">URL Generator</a>
  </div>

  <header>
    <div class="controls">
      <button id="loadBtn" onclick="app.load()" class="btn-primary">Load</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background: rgba(40, 167, 69, 0.15);"></div>
      <span>Translated</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: rgba(215, 58, 73, 0.15);"></div>
      <span>Missing</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: rgba(255, 193, 59, 0.15);"></div>
      <span>Outdated</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: rgba(255, 107, 107, 0.15);"></div>
      <span>Placeholder Issue</span>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="app.setFilter('all')">All Strings</button>
      <button class="filter-btn" onclick="app.setFilter('missing')">Missing</button>
      <button class="filter-btn" onclick="app.setFilter('outdated')">Outdated</button>
      <button class="filter-btn" onclick="app.setFilter('needs-work')">Needs Work</button>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search by key..." onkeyup="app.onSearch(event)">
    </div>
  </div>

  <div class="stats">
    <span id="statsTotal">Total: 0</span>
    <span id="statsMissing">Missing: 0</span>
    <span id="statsOutdated">Outdated: 0</span>
    <span id="statusMsg" class="status">Idle</span>
  </div>

  <div class="config-info" id="configInfo"></div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 180px;">Key</th>
          <th style="width: 1fr; min-width: 300px;">English</th>
          <th style="width: 1fr; min-width: 300px;">Translation</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <h3>No strings found</h3>
    <p>Load a strings.xml file to get started</p>
  </div>

  <div id="errorState" class="error-state" style="display:none;">
    <h3>Configuration Error</h3>
    <p id="errorMsg"></p>
  </div>
</div>

<script src="theme.js"></script>
<script src="translator.js"></script>

</body>
</html>
